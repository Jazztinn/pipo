[package]
name = "pipo-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only Moodle sidecar for Pipo"

[lib]
name = "pipo_core"
path = "src/lib.rs"

[[bin]]
name = "pipo-core"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
html2text = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.48", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"
