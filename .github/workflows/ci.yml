name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace

  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  menu-web:
    runs-on: macos-26
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify canonical menu stayed synchronized
        working-directory: .
        run: git diff --exit-code && git diff --check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository content and reachable history with gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$(awk '$2 == "gitleaks_8.28.0_linux_x64.tar.gz" { print $1 }' .github/vendor-checksums.txt)" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all"
      - name: Reject credential-like tracked files
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.(pem|p12|key))$'; then
            echo "Credential-like file is tracked"
            exit 1
          fi

  local-beta:
    if: github.event_name == 'push'
    needs: [rust, swift, menu-web, secret-scan]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build unsigned local beta
        env:
          PIPO_BUILD_SHA: ${{ github.sha }}
        run: scripts/build-local-beta.sh
      - name: Verify universal slices and bundle
        env:
          PIPO_BUILD_SHA: ${{ github.sha }}
        run: scripts/verify-release.sh dist/Pipo.app
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Pipo.app dist/Pipo-local-beta-universal.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Pipo-local-beta-universal
          path: dist/Pipo-local-beta-universal.zip
          if-no-files-found: error
          retention-days: 7
