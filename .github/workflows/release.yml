name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Info.plist, without v
        required: true
        type: string
      channel:
        description: Sparkle channel
        required: true
        default: stable
        type: choice
        options: [stable, beta]
      notarize:
        description: Sign with Developer ID and notarize installer
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  checks: read

concurrency:
  group: pipo-release-v2
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Validate release metadata
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Resources/Info.plist)" = "$VERSION"
          test "$(jq -r .version app/Sources/PipoUI/Resources/WhatsNew.json)" = "$VERSION"
          test "$(jq -r .build app/Sources/PipoUI/Resources/WhatsNew.json)" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' app/Resources/Info.plist)"
          test "$(jq -r .channel app/Sources/PipoUI/Resources/WhatsNew.json)" = "$CHANNEL"
          test "$(jq '.items | length >= 2 and length <= 4' app/Sources/PipoUI/Resources/WhatsNew.json)" = true
          jq -e '.importance == "standard" or .importance == "critical"' app/Sources/PipoUI/Resources/WhatsNew.json >/dev/null
          test "$(git tag -l "v$VERSION")" = ""
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Require successful checks for exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for required in rust swift menu-web secret-scan; do
            checks="$RUNNER_TEMP/check-$required.tsv"
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq ".check_runs[] | select(.name == \"$required\") | [.started_at, .id, .status, .conclusion] | @tsv" > "$checks"
            test -s "$checks"
            latest=$(sort -r "$checks" | head -n 1)
            status=$(printf '%s' "$latest" | cut -f3)
            conclusion=$(printf '%s' "$latest" | cut -f4)
            test "$status" = completed
            test "$conclusion" = success
          done

      - name: Import Developer ID certificate
        if: inputs.notarize
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_P12"
          KEYCHAIN="$RUNNER_TEMP/pipo-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/pipo-developer-id.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build universal app
        env:
          CODESIGN_IDENTITY: ${{ inputs.notarize && secrets.DEVELOPER_ID_APPLICATION || '-' }}
          PIPO_BUILD_SHA: ${{ github.sha }}
        run: |
          if [ "${{ inputs.notarize }}" = true ]; then test -n "$CODESIGN_IDENTITY"; fi
          scripts/build-local-beta.sh
          REQUIRE_NOTARIZATION=0 PIPO_BUILD_SHA="$GITHUB_SHA" scripts/verify-release.sh dist/Pipo.app

      - name: Verify app signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Pipo.app
          codesign -dv --verbose=4 dist/Pipo.app

      - name: Build installer
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/build-dmg.sh dist/Pipo.app "dist/Pipo-$VERSION-universal.dmg"

      - name: Sign, notarize, and staple installer
        if: inputs.notarize
        env:
          VERSION: ${{ inputs.version }}
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          test -n "$NOTARY_KEY_P8"
          export NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_FILE"
          scripts/notarize-release.sh "dist/Pipo-$VERSION-universal.dmg"

      - name: Create artifact checksum and build manifest
        env:
          VERSION: ${{ inputs.version }}
          NOTARIZED: ${{ inputs.notarize }}
        run: |
          DMG="dist/Pipo-$VERSION-universal.dmg"
          SHA256=$(shasum -a 256 "$DMG" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "$(basename "$DMG")" > "dist/Pipo-$VERSION-universal.sha256"
          jq -n \
            --arg version "$VERSION" \
            --arg source_commit "$GITHUB_SHA" \
            --arg artifact "$(basename "$DMG")" \
            --arg sha256 "$SHA256" \
            --argjson notarized "$NOTARIZED" \
            '{version: $version, source_commit: $source_commit, artifact: $artifact, sha256: $sha256, notarized: $notarized}' \
            > "dist/Pipo-$VERSION-universal.manifest.json"

      - name: Download Sparkle tools
        env:
          SPARKLE_VERSION: 2.9.2
        run: |
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o "$RUNNER_TEMP/sparkle.tar.xz"
          printf '%s  %s\n' "$(awk '$2 == "Sparkle-2.9.2.tar.xz" { print $1 }' .github/vendor-checksums.txt)" "$RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          test -x "$RUNNER_TEMP/sparkle/bin/generate_appcast"

      - name: Generate signed appcast
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NOTARIZED: ${{ inputs.notarize }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          UPDATES="$RUNNER_TEMP/updates"
          NOTES="$RUNNER_TEMP/release-notes.md"
          FEED=appcast.xml
          CHANNEL_ARGS=()
          RELEASE_ARGS=(--embed-release-notes)
          IMPORTANCE=$(jq -r .importance app/Sources/PipoUI/Resources/WhatsNew.json)
          if [ "$CHANNEL" = beta ]; then
            FEED=appcast-beta.xml
            CHANNEL_ARGS=(--channel beta)
          elif [ "$IMPORTANCE" = standard ]; then
            RELEASE_ARGS+=(--phased-rollout-interval 86400)
          fi
          if [ "$IMPORTANCE" = critical ]; then
            RELEASE_ARGS+=(--critical-update-version "")
          fi
          mkdir "$UPDATES"
          cp "dist/Pipo-$VERSION-universal.dmg" "$UPDATES/"
          {
            printf '# Pipo %s\n\n' "$VERSION"
            jq -r '.items[] | "- " + .' app/Sources/PipoUI/Resources/WhatsNew.json
            if [ "$NOTARIZED" != true ]; then
              printf '\n> This build is not notarized. macOS may require manual approval before first launch.\n'
            fi
          } > "$NOTES"
          cp "$NOTES" "$UPDATES/Pipo-$VERSION-universal.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/Jazztinn/pipo/releases/download/v$VERSION/" \
            --link "https://github.com/Jazztinn/pipo" \
            --maximum-deltas 0 \
            "${CHANNEL_ARGS[@]}" \
            "${RELEASE_ARGS[@]}" \
            -o "$FEED" \
            "$UPDATES"

      - name: Publish release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NOTARIZED: ${{ inputs.notarize }}
        run: |
          RELEASE_ARGS=()
          FEED=appcast.xml
          if [ "$CHANNEL" = beta ]; then
            RELEASE_ARGS=(--prerelease)
            FEED=appcast-beta.xml
          fi
          {
            printf '# Pipo %s\n\n' "$VERSION"
            jq -r '.items[] | "- " + .' app/Sources/PipoUI/Resources/WhatsNew.json
            if [ "$NOTARIZED" != true ]; then
              printf '\n> This build is not notarized. macOS may require manual approval before first launch.\n'
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          gh release create "v$VERSION" "dist/Pipo-$VERSION-universal.dmg" "dist/Pipo-$VERSION-universal.sha256" "dist/Pipo-$VERSION-universal.manifest.json" \
            --title "Pipo $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            "${RELEASE_ARGS[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FEED"
          git commit -m "release: publish v$VERSION update feed"
          test "$(git rev-parse HEAD~1)" = "$GITHUB_SHA"
          git push origin HEAD:main
